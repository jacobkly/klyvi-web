# One grouped PR per ecosystem each month, so updates arrive as a small,
# reviewable batch instead of a steady trickle.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Minor and patch bumps share one PR. Each major arrives alone, so one
    # breaking upgrade can't hold back the safe ones.
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
